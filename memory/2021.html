<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2021年</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFE4E9 0%, #FFC0CB 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            transition: background 0.3s ease;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .header h1 {
            font-size: 48px;
            color: #764ba2;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 20px;
            color: #666;
        }

        .timeline {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .timeline-item {
            display: flex;
            gap: 30px;
            margin-bottom: 60px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .timeline-date {
            min-width: 150px;
            text-align: right;
            padding-top: 10px;
        }

        .timeline-item:nth-child(even) .timeline-date {
            text-align: left;
        }

        .timeline-date h3 {
            font-size: 24px;
            color: #764ba2;
            margin-bottom: 5px;
        }

        .timeline-date p {
            color: #999;
            font-size: 14px;
        }

        .timeline-content {
            flex: 1;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
        }



        .timeline-content h4 {
            font-size: 22px;
            color: #333;
            margin-bottom: 15px;
        }

        .timeline-content p {
            line-height: 1.8;
            color: #666;
            font-size: 16px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .photo-grid img:hover {
            transform: scale(1.05);
        }

        .photo-grid img.full-image {
            object-fit: contain;
            max-height: 500px;
            height: auto;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .timeline-item {
                flex-direction: column !important;
                gap: 15px;
            }

            .timeline-date {
                text-align: left !important;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-button">← 戻る</a>

    <div class="header">
        <h1>2021年</h1>
        <p>　</p>
    </div>

                <div class="photo-grid">
                    <img src="pic/2021/0226.JPG" alt="嵐山１">
                    <img src="pic/2021/0226_02.JPG" alt="嵐山２">
                    <img src="pic/2021/0228_usj.JPG" alt="ユニバ１">

        </div>

        <div class="timeline-item">

            <div class="timeline-content">

        </div>

        <div class="timeline-item">

                </p>

                    <img src="pic/2021/0906_03.JPG" alt="今池３">

        </div>

        <div class="timeline-item">
            <div class="timeline-date">

        <div class="timeline-item">

    </div>
</body>
</html>
